<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моделирование распространения языков</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overscroll-behavior: none; }
        .controls-card { background-color: #1f2937; border: 1px solid #374151; }
        .control-label { color: #d1d5db; }
        .control-value { color: #f9fafb; }
        /* Стилизация ползунка для всех браузеров */
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: #3b82f6;
            cursor: pointer;
            border-radius: 9999px;
        }
        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #3b82f6;
            cursor: pointer;
            border-radius: 9999px;
        }
        /* Скрытие стрелок в полях number */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
            text-align: right; /* Выравнивание текста по правому краю */
        }
    </style>
</head>
<body class="bg-gray-900 text-white p-4 lg:p-8">
    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Панель управления -->
        <div class="lg:col-span-1 order-2 lg:order-1 flex flex-col gap-6">
            <div class="controls-card p-6 rounded-xl shadow-lg">
                <h2 class="text-2xl font-bold mb-6 text-center text-blue-400">Панель управления</h2>
                <div class="grid grid-cols-3 gap-3 mb-6">
                    <button id="startButton" class="w-full bg-green-600 hover:bg-green-700 font-semibold py-2 px-4 rounded-lg transition-colors">Запуск</button>
                    <button id="stopButton" class="w-full bg-yellow-600 hover:bg-yellow-700 font-semibold py-2 px-4 rounded-lg transition-colors">Остановка</button>
                    <button id="resetButton" class="w-full bg-red-600 hover:bg-red-700 font-semibold py-2 px-4 rounded-lg transition-colors">Сброс</button>
                </div>
                <div class="space-y-4">
                    <!-- Скорость -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label for="speedSlider" class="control-label">Скорость</label>
                            <input type="number" id="speedValue" min="1" max="60" step="1" value="5" class="w-24 bg-gray-800 border border-gray-600 rounded-md py-0.5 px-2 control-value">
                        </div>
                        <input id="speedSlider" type="range" min="1" max="60" step="1" value="5" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <!-- Коэффициент взаимодействия -->
                    <div>
                        <label for="interactionCoefficient" class="control-label">Коэффициент взаимодействия:</label>
                        <select id="interactionCoefficient" class="w-full mt-1 bg-gray-700 border border-gray-600 rounded-lg py-2 px-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </select>
                    </div>
                    <!-- Порог различия цветов -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label for="colorThreshold" class="control-label">Порог различия цветов</label>
                            <input type="number" id="colorThresholdValue" min="1" max="100" step="1" value="30" class="w-24 bg-gray-800 border border-gray-600 rounded-md py-0.5 px-2 control-value">
                        </div>
                        <input id="colorThreshold" type="range" min="1" max="100" step="1" value="30" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                </div>
            </div>

            <div class="controls-card p-6 rounded-xl shadow-lg">
                <h3 class="text-xl font-bold mb-4 text-center text-blue-400">Начальные условия и Параметры модели</h3>
                <div class="space-y-4">
                    <!-- Размер поля -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label for="gridSize" class="control-label">Размер поля (px)</label>
                            <input type="number" id="gridSizeValue" min="50" max="500" step="10" value="200" class="w-24 bg-gray-800 border border-gray-600 rounded-md py-0.5 px-2 control-value">
                        </div>
                        <input id="gridSize" type="range" min="50" max="500" step="10" value="200" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <!-- Начальное количество -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label for="initialPopulation" class="control-label">Начальное количество</label>
                            <input type="number" id="initialPopulationValue" min="1" max="10000" step="1" value="100" class="w-24 bg-gray-800 border border-gray-600 rounded-md py-0.5 px-2 control-value">
                        </div>
                        <input id="initialPopulation" type="range" min="1" max="10000" step="1" value="100" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <!-- Вероятность рождения -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label for="birthProbability" class="control-label">Вероятность рождения</label>
                            <input type="number" id="birthProbabilityValue" min="0" max="1" step="0.01" value="0.05" class="w-24 bg-gray-800 border border-gray-600 rounded-md py-0.5 px-2 control-value">
                        </div>
                        <input id="birthProbability" type="range" min="0" max="1" step="0.01" value="0.05" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <!-- Вероятность смерти -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label for="deathProbability" class="control-label">Вероятность смерти</label>
                            <input type="number" id="deathProbabilityValue" min="0" max="1" step="0.01" value="0.02" class="w-24 bg-gray-800 border border-gray-600 rounded-md py-0.5 px-2 control-value">
                        </div>
                        <input id="deathProbability" type="range" min="0" max="1" step="0.01" value="0.02" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <!-- Продолжительность жизни -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label for="lifespan" class="control-label">Продолжительность жизни</label>
                            <input type="number" id="lifespanValue" min="50" max="1000" step="10" value="200" class="w-24 bg-gray-800 border border-gray-600 rounded-md py-0.5 px-2 control-value">
                        </div>
                        <input id="lifespan" type="range" min="50" max="1000" step="10" value="200" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <!-- Радиус взаимодействия -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label for="interactionRadius" class="control-label">Радиус взаимодействия</label>
                            <input type="number" id="interactionRadiusValue" min="1" max="10" step="1" value="2" class="w-24 bg-gray-800 border border-gray-600 rounded-md py-0.5 px-2 control-value">
                        </div>
                        <input id="interactionRadius" type="range" min="1" max="10" step="1" value="2" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <!-- Частота взаимодействий -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label for="interactionFrequency" class="control-label">Частота взаимодействий</label>
                            <input type="number" id="interactionFrequencyValue" min="0.01" max="1" step="0.01" value="0.1" class="w-24 bg-gray-800 border border-gray-600 rounded-md py-0.5 px-2 control-value">
                        </div>
                        <input id="interactionFrequency" type="range" min="0.01" max="1" step="0.01" value="0.1" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <!-- Вероятность мутации -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label for="mutationProbability" class="control-label">Вероятность мутации</label>
                            <input type="number" id="mutationProbabilityValue" min="0" max="0.2" step="0.005" value="0.01" class="w-24 bg-gray-800 border border-gray-600 rounded-md py-0.5 px-2 control-value">
                        </div>
                        <input id="mutationProbability" type="range" min="0" max="0.2" step="0.005" value="0.01" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <!-- Шанс зарождения языка -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label for="genesisRate" class="control-label">Шанс зарождения языка</label>
                            <input type="number" id="genesisRateValue" min="0" max="0.01" step="0.0005" value="0.001" class="w-24 bg-gray-800 border border-gray-600 rounded-md py-0.5 px-2 control-value">
                        </div>
                        <input id="genesisRate" type="range" min="0" max="0.01" step="0.0005" value="0.001" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <!-- Сопротивление -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label for="resistance" class="control-label">Сопротивление</label>
                            <input type="number" id="resistanceValue" min="0" max="1" step="0.05" value="0" class="w-24 bg-gray-800 border border-gray-600 rounded-md py-0.5 px-2 control-value">
                        </div>
                        <input id="resistance" type="range" min="0" max="1" step="0.05" value="0" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <!-- Вероятность миграции -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label for="migrationProbability" class="control-label">Вероятность миграции</label>
                            <input type="number" id="migrationProbabilityValue" min="0" max="0.5" step="0.01" value="0.05" class="w-24 bg-gray-800 border border-gray-600 rounded-md py-0.5 px-2 control-value">
                        </div>
                        <input id="migrationProbability" type="range" min="0" max="0.5" step="0.01" value="0.05" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <!-- Вероятность забвения -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label for="forgettingProbability" class="control-label">Вероятность забвения</label>
                            <input type="number" id="forgettingProbabilityValue" min="0" max="0.01" step="0.0005" value="0" class="w-24 bg-gray-800 border border-gray-600 rounded-md py-0.5 px-2 control-value">
                        </div>
                        <input id="forgettingProbability" type="range" min="0" max="0.01" step="0.0005" value="0" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                </div>
            </div>
        </div>

        <!-- Область моделирования и статистики -->
        <div class="lg:col-span-2 order-1 lg:order-2 flex flex-col gap-6">
            <div class="controls-card p-6 rounded-xl shadow-lg">
                <h3 class="text-xl font-bold mb-4 text-center text-blue-400">Статистика</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-center">
                    <div>
                        <p class="text-lg control-label">Всего индивидов:</p>
                        <p id="populationCount" class="text-2xl font-bold control-value">0</p>
                    </div>
                    <div>
                        <p class="text-lg control-label">Различных языков:</p>
                        <p id="languageCount" class="text-2xl font-bold control-value">0</p>
                    </div>
                </div>
                <div class="mt-4">
                    <p class="text-lg control-label text-center mb-2">Распределение языков:</p>
                    <div id="languageDistribution" class="w-full h-24 bg-gray-900 rounded-lg p-2 flex items-end gap-1 border border-gray-700">
                    </div>
                </div>
            </div>
            <div class="relative w-full aspect-square bg-gray-800 rounded-xl border-2 border-gray-700 overflow-hidden">
                <canvas id="simulationCanvas" class="absolute top-0 left-0 w-full h-full"></canvas>
            </div>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- DOM Элементы ---
    const canvas = document.getElementById('simulationCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true }); // willReadFrequently для лучшей производительности чтения пикселей

    const startButton = document.getElementById('startButton');
    const stopButton = document.getElementById('stopButton');
    const resetButton = document.getElementById('resetButton');
    
    const interactionCoefficientSelect = document.getElementById('interactionCoefficient');

    const populationCountEl = document.getElementById('populationCount');
    const languageCountEl = document.getElementById('languageCount');
    const languageDistributionEl = document.getElementById('languageDistribution');

    // --- Конфигурация и состояние ---
    let settings = {}; // Объект для хранения всех настроек
    let population = []; // Массив объектов индивидов
    let isRunning = false; // Флаг состояния симуляции
    let animationFrameId; // ID для отмены requestAnimationFrame
    let frameCounter = 0; // Счетчик кадров для регулирования скорости
    let analyzeThrottle = 0; // Счетчик для регулирования частоты анализа языков

    let imageData = null; // Для хранения ImageData объекта Canvas
    let occupied = null; // 2D массив для отслеживания занятых ячеек

    // Определение коэффициентов взаимодействия
    const interactionCoefficients = [
        { name: 'Полное заимствование (A -> B)', c1: 0.0, c2: 1.0 }, // p1 становится как p2
        { name: 'Полное заимствование (B -> A)', c1: 1.0, c2: 0.0 }, // p2 становится как p1 (первоначальная логика)
        { name: 'Смешанный язык (50/50)', c1: 0.5, c2: 0.5 },
        { name: 'Доминирование первого (A:70%, B:30%)', c1: 0.7, c2: 0.3 },
        { name: 'Доминирование второго (A:30%, B:70%)', c1: 0.3, c2: 0.7 },
        { name: 'Усреднение (акцент на A:60%, B:40%)', c1: 0.6, c2: 0.4 },
        { name: 'Усреднение (акцент на B:40%, A:60%)', c1: 0.4, c2: 0.6 },
        { name: 'Слабое влияние второго (A:90%, B:10%)', c1: 0.9, c2: 0.1 },
        { name: 'Слабое влияние первого (A:10%, B:90%)', c1: 0.1, c2: 0.9 },
        { name: 'Консервативное развитие (A:80%, B:20%)', c1: 0.8, c2: 0.2 },
    ];

    // --- Вспомогательные функции ---

    /**
     * Генерирует случайное целое число от 0 до n-1.
     * @param {number} n Верхняя граница (исключительно).
     * @returns {number} Случайное целое число.
     */
    function rand(n){ return Math.floor(Math.random() * n); }

    /**
     * Генерирует случайный RGB цвет.
     * @returns {{r: number, g: number, b: number}} Объект цвета.
     */
    function randColor(){ 
        return {
            r: Math.floor(Math.random() * 256),
            g: Math.floor(Math.random() * 256),
            b: Math.floor(Math.random() * 256)
        };
    }

    /**
     * Проверяет, является ли цвет черным (близким к черному).
     * @param {{r: number, g: number, b: number}} c Объект цвета.
     * @returns {boolean} True, если цвет черный.
     */
    function isBlack(c){ return c.r < 5 && c.g < 5 && c.b < 5; } // Небольшой порог для "черного"

    /**
     * Обрезает значения цвета до диапазона [0, 255].
     * @param {number} r Красный компонент.
     * @param {number} g Зеленый компонент.
     * @param {number} b Синий компонент.
     * @returns {{r: number, g: number, b: number}} Обрезанный объект цвета.
     */
    function clampColor(r, g, b){ return { r: Math.max(0, Math.min(255, Math.round(r))), g: Math.max(0, Math.min(255, Math.round(g))), b: Math.max(0, Math.min(255, Math.round(b))) }; }

    /**
     * Вычисляет средний цвет соседних индивидов.
     * Используется для эффекта "забвения" или усреднения.
     * @param {{x: number, y: number, color: {r: number, g: number, b: number}}} ind Индивид, для которого вычисляется средний цвет.
     * @param {Map<string, object>} populationMap Карта позиций индивидов.
     * @returns {{r: number, g: number, b: number}} Средний цвет соседей.
     */
    function averageNeighborColor(ind, populationMap) {
        let sum = {r:0, g:0, b:0}, count=0;
        // Проверяем 8 соседних клеток
        for (let dx = -1; dx <= 1; dx++) {
            for (let dy = -1; dy <= 1; dy++) {
                if (!dx && !dy) continue; // Пропускаем самого себя
                const key = `${ind.x + dx},${ind.y + dy}`;
                const p = populationMap.get(key);
                if (p) {
                    sum.r += p.color.r; sum.g += p.color.g; sum.b += p.color.b;
                    count++;
                }
            }
        }
        if (!count) return ind.color; // Если нет соседей, возвращаем текущий цвет
        return { r: Math.floor(sum.r / count), g: Math.floor(sum.g / count), b: Math.floor(sum.b / count) };
    }

    // --- Инициализация и UI ---

    /** Заполняет выпадающий список коэффициентов взаимодействия. */
    function populateCoefficients() {
        interactionCoefficients.forEach((coef, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = coef.name;
            interactionCoefficientSelect.appendChild(option);
        });
        interactionCoefficientSelect.value = 2; // Устанавливаем "Смешанный язык" по умолчанию
    }

    /** Добавляет слушатели событий ко всем элементам управления. */
    function addEventListeners() {
        startButton.addEventListener('click', startSimulation);
        stopButton.addEventListener('click', stopSimulation);
        resetButton.addEventListener('click', () => { 
            readSettings(); // Сначала читаем текущие настройки
            resetSimulation(); 
        });

        interactionCoefficientSelect.addEventListener('change', () => { 
            settings.coefficientIndex = parseInt(interactionCoefficientSelect.value); 
        });

        // Список всех элементов управления, требующих синхронизации
        const controls = [
            { slider: 'speedSlider', number: 'speedValue', settingKey: 'speed', type: 'int' },
            { slider: 'colorThreshold', number: 'colorThresholdValue', settingKey: 'colorThreshold', type: 'int' },
            { slider: 'gridSize', number: 'gridSizeValue', settingKey: 'gridSize', type: 'int' },
            { slider: 'initialPopulation', number: 'initialPopulationValue', settingKey: 'initialPopulation', type: 'int' },
            { slider: 'birthProbability', number: 'birthProbabilityValue', settingKey: 'birthProbability', type: 'float' },
            { slider: 'deathProbability', number: 'deathProbabilityValue', settingKey: 'deathProbability', type: 'float' },
            { slider: 'lifespan', number: 'lifespanValue', settingKey: 'maxLifespan', type: 'int' }, // Изменено на maxLifespan
            { slider: 'interactionRadius', number: 'interactionRadiusValue', settingKey: 'interactionRadius', type: 'int' },
            { slider: 'interactionFrequency', number: 'interactionFrequencyValue', settingKey: 'interactionFrequency', type: 'float' },
            { slider: 'mutationProbability', number: 'mutationProbabilityValue', settingKey: 'mutationProbability', type: 'float' },
            { slider: 'genesisRate', number: 'genesisRateValue', settingKey: 'genesisRate', type: 'float' },
            { slider: 'resistance', number: 'resistanceValue', settingKey: 'resistance', type: 'float' },
            { slider: 'migrationProbability', number: 'migrationProbabilityValue', settingKey: 'migrationProbability', type: 'float' },
            { slider: 'forgettingProbability', number: 'forgettingProbabilityValue', settingKey: 'forgettingProbability', type: 'float' },
        ];

        controls.forEach(control => {
            const sliderEl = document.getElementById(control.slider);
            const numberEl = document.getElementById(control.number);

            if (!sliderEl || !numberEl) {
                console.warn(`Элементы ${control.slider} или ${control.number} не найдены.`);
                return;
            }

            // Синхронизация: ползунок -> числовое поле и настройки
            sliderEl.addEventListener('input', () => {
                numberEl.value = sliderEl.value;
                settings[control.settingKey] = (control.type === 'float') ? parseFloat(sliderEl.value) : parseInt(sliderEl.value);
            });

            // Синхронизация: числовое поле -> ползунок и настройки
            numberEl.addEventListener('input', () => {
                let value = (control.type === 'float') ? parseFloat(numberEl.value) : parseInt(numberEl.value);
                const min = parseFloat(sliderEl.min);
                const max = parseFloat(sliderEl.max);

                // Ограничиваем значение вводом
                if (isNaN(value)) value = min;
                if (value < min) value = min;
                if (value > max) value = max;
                
                sliderEl.value = value; // Обновляем ползунок
                settings[control.settingKey] = value; // Обновляем настройки
            });

            // Корректировка значения при уходе из фокуса
            numberEl.addEventListener('blur', () => {
                let value = (control.type === 'float') ? parseFloat(numberEl.value) : parseInt(numberEl.value);
                const min = parseFloat(sliderEl.min);
                const max = parseFloat(sliderEl.max);

                if (isNaN(value) || value < min) {
                    value = min;
                } else if (value > max) {
                    value = max;
                }
                numberEl.value = value;
                sliderEl.value = value;
                settings[control.settingKey] = value;
            });
        });
    }

    /** Считывает все текущие значения настроек из DOM в объект settings. */
    function readSettings() {
        settings = {};
        const controlElements = [
            { id: 'speedSlider', key: 'speed', type: 'float' },
            { id: 'gridSize', key: 'gridSize', type: 'int' },
            { id: 'initialPopulation', key: 'initialPopulation', type: 'int' },
            { id: 'birthProbability', key: 'birthProbability', type: 'float' },
            { id: 'deathProbability', key: 'deathProbability', type: 'float' },
            { id: 'lifespan', key: 'maxLifespan', type: 'int' }, // Использование 'lifespan' для slider, но 'maxLifespan' для settings
            { id: 'interactionRadius', key: 'interactionRadius', type: 'int' },
            { id: 'interactionFrequency', key: 'interactionFrequency', type: 'float' },
            { id: 'colorThreshold', key: 'colorThreshold', type: 'int' },
            { id: 'mutationProbability', key: 'mutationProbability', type: 'float' },
            { id: 'genesisRate', key: 'genesisRate', type: 'float' },
            { id: 'resistance', key: 'resistance', type: 'float' },
            { id: 'migrationProbability', key: 'migrationProbability', type: 'float' },
            { id: 'forgettingProbability', key: 'forgettingProbability', type: 'float' },
        ];
        
        controlElements.forEach(control => {
            const el = document.getElementById(control.id);
            if (el) {
                settings[control.key] = (control.type === 'float') ? parseFloat(el.value) : parseInt(el.value);
            } else {
                console.warn(`Элемент с ID ${control.id} не найден.`);
            }
        });
        settings.coefficientIndex = parseInt(interactionCoefficientSelect.value);
    }

    // --- Логика симуляции ---

    /** Инициализирует или сбрасывает состояние симуляции. */
    function resetSimulation() {
        stopSimulation(); // Останавливаем текущую симуляцию, если она запущена
        population = [];
        
        // Обновляем размер canvas
        canvas.width = settings.gridSize;
        canvas.height = settings.gridSize;
        
        // Пересоздаем массив занятых ячеек
        occupied = Array.from({ length: settings.gridSize }, () => Array(settings.gridSize).fill(false));
        
        // Пересоздаем imageData
        imageData = ctx.createImageData(canvas.width, canvas.height);

        // Инициализируем популяцию
        const initCount = Math.min(settings.initialPopulation, settings.gridSize * settings.gridSize);
        for (let i = 0; i < initCount; i++) {
            let x, y;
            let attempts = 0;
            // Ищем свободную ячейку
            do { 
                x = rand(settings.gridSize); 
                y = rand(settings.gridSize); 
                attempts++;
            } while (occupied[y]?.[x] && attempts < settings.gridSize * settings.gridSize * 2); // Ограничение попыток
            
            if (!occupied[y]?.[x]) { // Если нашли свободную ячейку
                occupied[y][x] = true;
                population.push({ x, y, color: randColor(), age: 0 });
            } else {
                console.warn("Не удалось найти свободное место для нового индивида.");
                break; // Если не можем найти место, прекращаем инициализацию
            }
        }
        drawPopulation();
        updateStats();
        analyzeLanguages();
    }

    /** Запускает симуляцию. */
    function startSimulation() {
        if (isRunning) return; // Предотвращаем повторный запуск
        isRunning = true;
        readSettings(); // Убедимся, что настройки актуальны
        animationFrameId = requestAnimationFrame(simulationLoop);
    }

    /** Останавливает симуляцию. */
    function stopSimulation() {
        isRunning = false;
        if (animationFrameId) {
            cancelAnimationFrame(animationFrameId);
        }
    }

    /** Основной цикл симуляции. */
    function simulationLoop() {
        if (!isRunning) return;

        // Регулирование скорости симуляции: чем выше settings.speed, тем чаще обновляется кадр
        frameCounter++;
        if (frameCounter >= (61 - settings.speed)) { // 60 FPS - settings.speed
            frameCounter = 0;
            handleLifecycle();
            handleInteractions();
            drawPopulation();
            updateStats();
            
            // Анализ языков реже, чтобы не нагружать процессор
            if (++analyzeThrottle >= 10) { 
                analyzeLanguages(); 
                analyzeThrottle = 0; 
            }
        }
        animationFrameId = requestAnimationFrame(simulationLoop);
    }

    /** Отрисовывает текущее состояние популяции на canvas. */
    function drawPopulation() {
        const data = imageData.data;
        // Очищаем canvas (заливаем белым фоном)
        for (let i = 0; i < data.length; i += 4) {
            data[i] = 255;     // Red
            data[i + 1] = 255; // Green
            data[i + 2] = 255; // Blue
            data[i + 3] = 255; // Alpha
        }
        
        // Рисуем индивидов
        for (const p of population) {
            const idx = (p.y * canvas.width + p.x) * 4;
            data[idx] = p.color.r;
            data[idx + 1] = p.color.g;
            data[idx + 2] = p.color.b;
            data[idx + 3] = 255; // Полная непрозрачность
        }
        ctx.putImageData(imageData, 0, 0);
    }

    /** Обрабатывает жизненный цикл индивидов: старение, рождение, смерть, забвение, миграция. */
    function handleLifecycle() {
        const nextPopulation = [];
        // Создаем Map для быстрого доступа к индивидам по координатам
        const populationMap = new Map(population.map(p => [`${p.x},${p.y}`, p]));

        // Обнуляем occupied для перерасчета занятых клеток после миграции и смерти
        occupied = Array.from({ length: settings.gridSize }, () => Array(settings.gridSize).fill(false));

        for (const ind of population) {
            ind.age++;
            // Смерть от старости или случайная смерть
            if (ind.age > settings.maxLifespan || Math.random() < settings.deathProbability) {
                continue; // Индивид умирает
            }

            // Вероятность забвения (изменение языка в сторону среднего соседского)
            if (Math.random() < settings.forgettingProbability) {
                ind.color = averageNeighborColor(ind, populationMap);
            }

            // Миграция
            if (Math.random() < settings.migrationProbability) {
                const emptyNeighbors = [];
                for (let dx = -1; dx <= 1; dx++) {
                    for (let dy = -1; dy <= 1; dy++) {
                        if (!dx && !dy) continue; // Пропускаем самого себя
                        const nx = ind.x + dx;
                        const ny = ind.y + dy;
                        // Проверяем границы поля и наличие пустого места
                        if (nx >= 0 && nx < settings.gridSize && ny >= 0 && ny < settings.gridSize && !occupied[ny][nx]) {
                            emptyNeighbors.push({ x: nx, y: ny });
                        }
                    }
                }
                if (emptyNeighbors.length > 0) {
                    const newPos = emptyNeighbors[rand(emptyNeighbors.length)];
                    ind.x = newPos.x;
                    ind.y = newPos.y;
                }
            }
            // Добавляем индивида в следующую популяцию, помечая его новую позицию как занятую
            if (ind.x >= 0 && ind.x < settings.gridSize && ind.y >= 0 && ind.y < settings.gridSize) {
                 if (!occupied[ind.y][ind.x]) { // Проверяем, чтобы новая позиция не была занята другим индивидом в этом же цикле
                    occupied[ind.y][ind.x] = true;
                    nextPopulation.push(ind);
                 } else {
                    // Если новая позиция занята, индивид остается на старой (или умирает, если нет места)
                    // В данном случае, просто не добавляем его в nextPopulation, если он не смог мигрировать
                 }
            }
        }

        // Рождения
        const births = Math.floor(population.length * settings.birthProbability);
        for (let i = 0; i < births && nextPopulation.length < settings.gridSize * settings.gridSize; i++) {
            if (nextPopulation.length === 0) break;
            const parent = nextPopulation[rand(nextPopulation.length)]; // Выбираем случайного родителя
            
            const emptyBirthSpots = [];
            // Радиус поиска места для рождения вокруг родителя (например, радиус взаимодействия + 1)
            const birthSearchRadius = settings.interactionRadius + 1; 

            // Собираем все свободные места рядом с родителем
            for (let dx = -birthSearchRadius; dx <= birthSearchRadius; dx++) {
                for (let dy = -birthSearchRadius; dy <= birthSearchRadius; dy++) {
                    const newX = parent.x + dx;
                    const newY = parent.y + dy;

                    // Проверяем границы поля и занятость клетки
                    if (newX >= 0 && newX < settings.gridSize &&
                        newY >= 0 && newY < settings.gridSize &&
                        !occupied[newY][newX]) {
                        emptyBirthSpots.push({ x: newX, y: newY });
                    }
                }
            }

            let finalX, finalY;
            if (emptyBirthSpots.length > 0) {
                // Если есть свободные места рядом, выбираем случайное из них
                const chosenSpot = emptyBirthSpots[rand(emptyBirthSpots.length)];
                finalX = chosenSpot.x;
                finalY = chosenSpot.y;
            } else {
                // Если рядом нет свободных мест, ищем случайное свободное место на всем поле
                let attempts = 0;
                do {
                    finalX = rand(settings.gridSize);
                    finalY = rand(settings.gridSize);
                    attempts++;
                } while (occupied[finalY]?.[finalX] && attempts < settings.gridSize * settings.gridSize * 2); // Ограничение попыток
            }

            // Если найдено место (рядом или случайное), добавляем нового индивида
            if (finalX !== undefined && finalY !== undefined && !occupied[finalY]?.[finalX]) {
                occupied[finalY][finalX] = true;
                nextPopulation.push({ x: finalX, y: finalY, color: { ...parent.color }, age: 0 });
            } else {
                // console.warn("Не удалось найти свободное место для нового индивида после многих попыток.");
                // Если даже случайный поиск не дал результата, пропускаем это рождение.
            }
        }
        population = nextPopulation; // Обновляем популяцию
    }

    /** Обрабатывает взаимодействия между индивидами (изменение языка, мутации, зарождение новых языков). */
    function handleInteractions() {
        if (Math.random() > settings.interactionFrequency) return; // Регулируем частоту взаимодействий

        const map = new Map(population.map(p => [`${p.x},${p.y}`, p])); // Карта для быстрого поиска индивидов

        for (const p1 of population) {
            // Шанс зарождения нового языка для "черных" (несуществующих) языков
            if (isBlack(p1.color) && Math.random() < settings.genesisRate) {
                p1.color = randColor();
                continue; // Этот индивид уже изменился, переходим к следующему
            }

            const neighbors = [];
            // Ищем соседей в радиусе взаимодействия
            for (let dx = -settings.interactionRadius; dx <= settings.interactionRadius; dx++) {
                for (let dy = -settings.interactionRadius; dy <= settings.interactionRadius; dy++) {
                    if (!dx && !dy) continue; // Пропускаем самого себя
                    const key = `${p1.x + dx},${p1.y + dy}`;
                    if (map.has(key)) {
                        neighbors.push(map.get(key));
                    }
                }
            }

            if (neighbors.length === 0) continue; // Если нет соседей, переходим к следующему индивиду

            const p2 = neighbors[rand(neighbors.length)]; // Выбираем случайного соседа для взаимодействия

            // Если p2 говорит на "черном" языке или сопротивляется, взаимодействие не происходит
            if (isBlack(p2.color) || Math.random() < settings.resistance) continue;

            const coef = interactionCoefficients[settings.coefficientIndex];

            // Расчет нового цвета языка p1 на основе коэффициентов взаимодействия
            let nr = p1.color.r * coef.c1 + p2.color.r * coef.c2;
            let ng = p1.color.g * coef.c1 + p2.color.g * coef.c2;
            let nb = p1.color.b * coef.c1 + p2.color.b * coef.c2;

            // Мутация
            if (Math.random() < settings.mutationProbability) {
                const mutationAmount = 20; // Величина мутации (до +/- 20 для каждого компонента)
                nr += rand(mutationAmount * 2) - mutationAmount; 
                ng += rand(mutationAmount * 2) - mutationAmount; 
                nb += rand(mutationAmount * 2) - mutationAmount;
            }
            
            // Применяем новый цвет к p1
            const newColor = clampColor(nr, ng, nb);
            p1.color = newColor;

            // Если p2 не сопротивляется, он также принимает новый язык (или мутирует вместе с p1)
            if (Math.random() >= settings.resistance) {
                p2.color = { ...newColor }; // Создаем копию объекта цвета
            }
        }
    }

    // --- Статистика и анализ ---

    /** Обновляет отображаемое количество индивидов. */
    function updateStats() {
        populationCountEl.textContent = population.length;
    }

    /**
     * Вычисляет эвклидово расстояние между двумя цветами в RGB пространстве.
     * @param {{r: number, g: number, b: number}} c1 Первый цвет.
     * @param {{r: number, g: number, b: number}} c2 Второй цвет.
     * @returns {number} Расстояние между цветами.
     */
    function colorDistance(c1, c2) {
        const dr = c1.r - c2.r; 
        const dg = c1.g - c2.g; 
        const db = c1.b - c2.b;
        return Math.sqrt(dr * dr + dg * dg + db * db);
    }

    /** Анализирует количество уникальных языков и их распределение. */
    function analyzeLanguages() {
        // Исключаем "черные" языки из анализа
        const nonBlackPopulation = population.filter(p => !isBlack(p.color));
        if (nonBlackPopulation.length === 0) {
            languageCountEl.textContent = '0';
            languageDistributionEl.innerHTML = '';
            return;
        }

        const distinctLanguages = [];
        for (const individual of nonBlackPopulation) {
            let found = false;
            // Проверяем, относится ли текущий язык к уже найденным
            for (const lang of distinctLanguages) {
                if (colorDistance(individual.color, lang.color) < settings.colorThreshold) {
                    lang.count++;
                    found = true;
                    break;
                }
            }
            // Если язык не найден, добавляем его как новый
            if (!found) {
                distinctLanguages.push({ color: { ...individual.color }, count: 1 });
            }
        }
        languageCountEl.textContent = distinctLanguages.length;
        drawDistribution(distinctLanguages);
    }

    /**
     * Отрисовывает гистограмму распределения языков.
     * @param {Array<object>} languages Массив объектов языков с цветом и количеством.
     */
    function drawDistribution(languages) {
        languageDistributionEl.innerHTML = ''; // Очищаем предыдущую гистограмму
        const total = languages.reduce((sum, lang) => sum + lang.count, 0);
        if (total === 0) return;

        // Сортируем языки по убыванию количества для лучшей визуализации
        languages.sort((a, b) => b.count - a.count);

        // Ограничиваем количество столбиков для более читаемой гистограммы
        const maxBars = 30; // Максимальное количество отображаемых столбиков
        const displayLanguages = languages.slice(0, maxBars);

        for (const lang of displayLanguages) {
            const bar = document.createElement('div');
            const percentage = (lang.count / total) * 100;
            bar.style.height = `${Math.max(1, percentage)}%`; // Минимум 1% для видимости
            bar.style.width = '10px';
            bar.style.flexShrink = '0';
            bar.style.backgroundColor = `rgb(${lang.color.r}, ${lang.color.g}, ${lang.color.b})`;
            bar.title = `RGB(${lang.color.r}, ${lang.color.g}, ${lang.color.b})\nКоличество: ${lang.count} (${percentage.toFixed(1)}%)`;
            bar.classList.add('rounded-sm'); // Немного скругляем края столбиков
            languageDistributionEl.appendChild(bar);
        }
    }

    // --- Запуск ---
    /** Инициализация приложения при загрузке DOM. */
    function init() {
        populateCoefficients(); // Заполняем выпадающий список
        addEventListeners(); // Добавляем слушатели событий
        readSettings(); // Считываем начальные настройки
        resetSimulation(); // Инициализируем симуляцию
    }

    init(); // Запускаем инициализацию
});
</script>
