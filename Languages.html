<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моделирование распространения языков</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overscroll-behavior: none; }
        .controls-card { background-color: #1f2937; border: 1px solid #374151; }
        .control-label { color: #d1d5db; }
        .control-value { color: #f9fafb; }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: #3b82f6;
            cursor: pointer;
            border-radius: 9999px;
        }
        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #3b82f6;
            cursor: pointer;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-gray-900 text-white p-4 lg:p-8">
    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Панель управления -->
        <div class="lg:col-span-1 order-2 lg:order-1 flex flex-col gap-6">
            <div class="controls-card p-6 rounded-xl shadow-lg">
                <h2 class="text-2xl font-bold mb-6 text-center text-blue-400">Панель управления</h2>
                <div class="grid grid-cols-3 gap-3 mb-6">
                    <button id="startButton" class="w-full bg-green-600 hover:bg-green-700 font-semibold py-2 px-4 rounded-lg transition-colors">Запуск</button>
                    <button id="stopButton" class="w-full bg-yellow-600 hover:bg-yellow-700 font-semibold py-2 px-4 rounded-lg transition-colors">Остановка</button>
                    <button id="resetButton" class="w-full bg-red-600 hover:bg-red-700 font-semibold py-2 px-4 rounded-lg transition-colors">Сброс</button>
                </div>
                <div class="space-y-5">
                    <div>
                        <label for="speedSlider" class="control-label flex justify-between">Скорость: <span id="speedValue" class="control-value">5</span></label>
                        <input id="speedSlider" type="range" min="1" max="60" value="5" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <div>
                        <label for="interactionCoefficient" class="control-label">Коэффициент взаимодействия:</label>
                        <select id="interactionCoefficient" class="w-full mt-1 bg-gray-700 border border-gray-600 rounded-lg py-2 px-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </select>
                    </div>
                     <div>
                        <label for="colorThreshold" class="control-label flex justify-between">Порог различия цветов: <span id="colorThresholdValue" class="control-value">30</span></label>
                        <input id="colorThreshold" type="range" min="1" max="100" value="30" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                </div>
            </div>

            <div class="controls-card p-6 rounded-xl shadow-lg">
                <h3 class="text-xl font-bold mb-4 text-center text-blue-400">Начальные условия</h3>
                <div class="space-y-4">
                     <div>
                        <label for="gridSize" class="control-label flex justify-between">Размер поля (px): <span id="gridSizeValue" class="control-value">200x200</span></label>
                        <input id="gridSize" type="range" min="50" max="500" value="200" step="10" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <div>
                        <label for="initialPopulation" class="control-label flex justify-between">Начальное количество: <span id="initialPopulationValue" class="control-value">100</span></label>
                        <input id="initialPopulation" type="range" min="1" max="1000" value="100" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                     <div>
                        <label for="birthProbability" class="control-label flex justify-between">Вероятность рождения: <span id="birthProbabilityValue" class="control-value">0.05</span></label>
                        <input id="birthProbability" type="range" min="0" max="1" value="0.05" step="0.01" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <div>
                        <label for="deathProbability" class="control-label flex justify-between">Вероятность смерти: <span id="deathProbabilityValue" class="control-value">0.02</span></label>
                        <input id="deathProbability" type="range" min="0" max="1" value="0.02" step="0.01" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <div>
                        <label for="lifespan" class="control-label flex justify-between">Продолжительность жизни: <span id="lifespanValue" class="control-value">200</span></label>
                        <input id="lifespan" type="range" min="50" max="1000" value="200" step="10" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <div>
                        <label for="interactionRadius" class="control-label flex justify-between">Радиус взаимодействия: <span id="interactionRadiusValue" class="control-value">2</span></label>
                        <input id="interactionRadius" type="range" min="1" max="10" value="2" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <div>
                        <label for="interactionFrequency" class="control-label flex justify-between">Частота взаимодействий: <span id="interactionFrequencyValue" class="control-value">0.1</span></label>
                        <input id="interactionFrequency" type="range" min="0.01" max="1" value="0.1" step="0.01" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <div>
                        <label for="mutationProbability" class="control-label flex justify-between">Вероятность мутации: <span id="mutationProbabilityValue" class="control-value">0.01</span></label>
                        <input id="mutationProbability" type="range" min="0" max="0.2" value="0.01" step="0.005" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <div>
                        <label for="genesisRate" class="control-label flex justify-between">Шанс зарождения языка: <span id="genesisRateValue" class="control-value">0.001</span></label>
                        <input id="genesisRate" type="range" min="0" max="0.01" value="0.001" step="0.0005" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <div>
                        <label for="resistance" class="control-label flex justify-between">Сопротивление изменениям: <span id="resistanceValue" class="control-value">0</span></label>
                        <input id="resistance" type="range" min="0" max="1" value="0" step="0.05" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <div>
                        <label for="migrationProbability" class="control-label flex justify-between">Вероятность миграции: <span id="migrationProbabilityValue" class="control-value">0.05</span></label>
                        <input id="migrationProbability" type="range" min="0" max="0.5" value="0.05" step="0.01" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <div>
                        <label for="forgettingProbability" class="control-label flex justify-between">Вероятность забвения: <span id="forgettingProbabilityValue" class="control-value">0</span></label>
                        <input id="forgettingProbability" type="range" min="0" max="0.01" value="0" step="0.0005" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                </div>
            </div>
        </div>

        <!-- Область моделирования и статистики -->
        <div class="lg:col-span-2 order-1 lg:order-2 flex flex-col gap-6">
            <div class="controls-card p-6 rounded-xl shadow-lg">
                 <h3 class="text-xl font-bold mb-4 text-center text-blue-400">Статистика</h3>
                 <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-center">
                     <div>
                         <p class="text-lg control-label">Всего индивидов:</p>
                         <p id="populationCount" class="text-2xl font-bold control-value">0</p>
                     </div>
                     <div>
                         <p class="text-lg control-label">Различных языков:</p>
                         <p id="languageCount" class="text-2xl font-bold control-value">0</p>
                     </div>
                 </div>
                 <div class="mt-4">
                     <p class="text-lg control-label text-center mb-2">Распределение языков:</p>
                     <div id="languageDistribution" class="w-full h-24 bg-gray-900 rounded-lg p-2 flex items-end gap-1 border border-gray-700">
                     </div>
                 </div>
            </div>
            <div class="relative w-full aspect-square bg-gray-800 rounded-xl border-2 border-gray-700 overflow-hidden">
                <canvas id="simulationCanvas" class="absolute top-0 left-0 w-full h-full"></canvas>
            </div>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- DOM Элементы ---
    const canvas = document.getElementById('simulationCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    const startButton = document.getElementById('startButton');
    const stopButton = document.getElementById('stopButton');
    const resetButton = document.getElementById('resetButton');
    
    const speedSlider = document.getElementById('speedSlider');
    const interactionCoefficientSelect = document.getElementById('interactionCoefficient');
    const colorThresholdSlider = document.getElementById('colorThreshold');
    const gridSizeSlider = document.getElementById('gridSize');
    const initialPopulationSlider = document.getElementById('initialPopulation');
    const birthProbabilitySlider = document.getElementById('birthProbability');
    const deathProbabilitySlider = document.getElementById('deathProbability');
    const lifespanSlider = document.getElementById('lifespan');
    const interactionRadiusSlider = document.getElementById('interactionRadius');
    const interactionFrequencySlider = document.getElementById('interactionFrequency');
    const mutationProbabilitySlider = document.getElementById('mutationProbability');
    const genesisRateSlider = document.getElementById('genesisRate');
    const resistanceSlider = document.getElementById('resistance');
    const migrationProbabilitySlider = document.getElementById('migrationProbability');
    const forgettingProbabilitySlider = document.getElementById('forgettingProbability');

    const populationCountEl = document.getElementById('populationCount');
    const languageCountEl = document.getElementById('languageCount');
    const languageDistributionEl = document.getElementById('languageDistribution');

    // --- Конфигурация и состояние ---
    let settings = {}, population = [], isRunning = false;
    let animationFrameId, frameCounter = 0, analyzeThrottle = 0;
    let imageData = null, occupied = null;

    const interactionCoefficients = [
        { name: 'Полное заимствование', c1: 1.0, c2: 0.0 },
        { name: 'Полное заимствование (наоборот)', c1: 0.0, c2: 1.0 },
        { name: 'Смешанный язык', c1: 0.5, c2: 0.5 },
        { name: 'Доминирование первого', c1: 0.7, c2: 0.3 },
        { name: 'Доминирование второго', c1: 0.3, c2: 0.7 },
        { name: 'Усреднение (акцент на 1)', c1: 0.6, c2: 0.4 },
        { name: 'Усреднение (акцент на 2)', c1: 0.4, c2: 0.6 },
        { name: 'Слабое влияние второго', c1: 0.9, c2: 0.1 },
        { name: 'Слабое влияние первого', c1: 0.1, c2: 0.9 },
        { name: 'Консервативное развитие', c1: 0.8, c2: 0.2 },
    ];

    // --- Вспомогательные функции ---
    function rand(n){ return Math.floor(Math.random() * n); }
    function randColor(){
  return {
    r: Math.floor(Math.random() * 256),
    g: Math.floor(Math.random() * 256),
    b: Math.floor(Math.random() * 256)
  };
}
    function isBlack(c){ return c.r === 0 && c.g === 0 && c.b === 0; }
    function clampColor(r, g, b){ return { r: Math.max(0, Math.min(255, Math.floor(r))), g: Math.max(0, Math.min(255, Math.floor(g))), b: Math.max(0, Math.min(255, Math.floor(b))) }; }

    function averageNeighborColor(ind, populationMap) {
        let sum = {r:0, g:0, b:0}, count=0;
        for (let dx = -1; dx <= 1; dx++) {
            for (let dy = -1; dy <= 1; dy++) {
                if (!dx && !dy) continue;
                const key = `${ind.x + dx},${ind.y + dy}`;
                const p = populationMap.get(key);
                if (p) {
                    sum.r += p.color.r; sum.g += p.color.g; sum.b += p.color.b;
                    count++;
                }
            }
        }
        if (!count) return ind.color;
        return { r: Math.floor(sum.r / count), g: Math.floor(sum.g / count), b: Math.floor(sum.b / count) };
    }

    // --- Инициализация и UI ---
    function populateCoefficients() {
        interactionCoefficients.forEach((coef, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = coef.name;
            interactionCoefficientSelect.appendChild(option);
        });
        interactionCoefficientSelect.value = 2;
    }

    function addEventListeners() {
        startButton.addEventListener('click', startSimulation);
        stopButton.addEventListener('click', stopSimulation);
        resetButton.addEventListener('click', () => { readSettings(); resetSimulation(); });

        speedSlider.addEventListener('input', e => { settings.speed = parseInt(e.target.value); document.getElementById('speedValue').textContent = e.target.value; });
        colorThresholdSlider.addEventListener('input', e => { settings.colorThreshold = parseInt(e.target.value); document.getElementById('colorThresholdValue').textContent = e.target.value; });
        interactionCoefficientSelect.addEventListener('change', () => { settings.coefficientIndex = parseInt(interactionCoefficientSelect.value); });

        // Настройки, требующие сброса
        const resetInputs = [gridSizeSlider, initialPopulationSlider, birthProbabilitySlider, deathProbabilitySlider, lifespanSlider, interactionRadiusSlider, interactionFrequencySlider, mutationProbabilitySlider, genesisRateSlider, resistanceSlider, migrationProbabilitySlider, forgettingProbabilitySlider];
        const valueSpans = {
            gridSize: v => `${v}x${v}`, initialPopulation: v => v, birthProbability: v => parseFloat(v).toFixed(2), deathProbability: v => parseFloat(v).toFixed(2),
            lifespan: v => v, interactionRadius: v => v, interactionFrequency: v => parseFloat(v).toFixed(2), mutationProbability: v => parseFloat(v).toFixed(3),
            genesisRate: v => parseFloat(v).toFixed(4), resistance: v => parseFloat(v).toFixed(2), migrationProbability: v => parseFloat(v).toFixed(2), forgettingProbability: v => parseFloat(v).toFixed(4)
        };
        resetInputs.forEach(input => {
            input.addEventListener('input', e => {
                const valueSpan = document.getElementById(`${e.target.id}Value`);
                if (valueSpan) valueSpan.textContent = valueSpans[e.target.id](e.target.value);
            });
        });
    }

    function readSettings() {
        settings = {
            speed: parseInt(speedSlider.value), gridSize: parseInt(gridSizeSlider.value), initialPopulation: parseInt(initialPopulationSlider.value),
            birthProbability: parseFloat(birthProbabilitySlider.value), deathProbability: parseFloat(deathProbabilitySlider.value), maxLifespan: parseInt(lifespanSlider.value),
            interactionRadius: parseInt(interactionRadiusSlider.value), interactionFrequency: parseFloat(interactionFrequencySlider.value), colorThreshold: parseInt(colorThresholdSlider.value),
            coefficientIndex: parseInt(interactionCoefficientSelect.value), mutationProbability: parseFloat(mutationProbabilitySlider.value), genesisRate: parseFloat(genesisRateSlider.value),
            resistance: parseFloat(resistanceSlider.value), migrationProbability: parseFloat(migrationProbabilitySlider.value), forgettingProbability: parseFloat(forgettingProbabilitySlider.value),
        };
    }

    // --- Логика симуляции ---
    function resetSimulation() {
        stopSimulation();
        population = [];
        canvas.width = settings.gridSize;
        canvas.height = settings.gridSize;
        occupied = Array.from({ length: settings.gridSize }, () => Array(settings.gridSize).fill(false));
        imageData = ctx.createImageData(canvas.width, canvas.height);

        const initCount = Math.min(settings.initialPopulation, settings.gridSize * settings.gridSize);
        for (let i = 0; i < initCount; i++) {
            let x, y;
            do { x = rand(settings.gridSize); y = rand(settings.gridSize); } while (occupied[y][x]);
            occupied[y][x] = true;
            population.push({ x, y, color: randColor(), age: 0 });
        }
        drawPopulation();
        updateStats();
        analyzeLanguages();
    }

    function startSimulation() {
        if (isRunning) return;
        isRunning = true;
        readSettings();
        animationFrameId = requestAnimationFrame(simulationLoop);
    }

    function stopSimulation() {
        isRunning = false;
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
    }

    function simulationLoop() {
        if (!isRunning) return;
        frameCounter++;
        if (frameCounter >= (61 - settings.speed)) {
            frameCounter = 0;
            handleLifecycle();
            handleInteractions();
            drawPopulation();
            updateStats();
            if (++analyzeThrottle >= 10) { analyzeLanguages(); analyzeThrottle = 0; }
        }
        animationFrameId = requestAnimationFrame(simulationLoop);
    }

    function drawPopulation() {
        const data = imageData.data;
        data.fill(255); // Быстрая заливка белым
        for (const p of population) {
            const idx = (p.y * canvas.width + p.x) * 4;
            data[idx] = p.color.r; data[idx + 1] = p.color.g; data[idx + 2] = p.color.b;
        }
        ctx.putImageData(imageData, 0, 0);
    }

    function handleLifecycle() {
        const nextPopulation = [];
        const populationMap = new Map(population.map(p => [`${p.x},${p.y}`, p]));

        for (const ind of population) {
            ind.age++;
            if (ind.age > settings.maxLifespan || Math.random() < settings.deathProbability) {
                occupied[ind.y][ind.x] = false;
                continue;
            }
            if (Math.random() < settings.forgettingProbability) {
                ind.color = averageNeighborColor(ind, populationMap);
            }
            if (Math.random() < settings.migrationProbability) {
                const emptyNeighbors = [];
                for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
                    if (!dx && !dy) continue;
                    const nx = ind.x + dx, ny = ind.y + dy;
                    if (nx >= 0 && nx < settings.gridSize && ny >= 0 && ny < settings.gridSize && !occupied[ny][nx]) {
                        emptyNeighbors.push({ x: nx, y: ny });
                    }
                }
                if (emptyNeighbors.length > 0) {
                    const newPos = emptyNeighbors[rand(emptyNeighbors.length)];
                    occupied[ind.y][ind.x] = false;
                    occupied[newPos.y][newPos.x] = true;
                    ind.x = newPos.x; ind.y = newPos.y;
                }
            }
            nextPopulation.push(ind);
        }

        const births = Math.floor(nextPopulation.length * settings.birthProbability);
        for (let i = 0; i < births && nextPopulation.length < settings.gridSize * settings.gridSize; i++) {
            if (nextPopulation.length === 0) break;
            const parent = nextPopulation[rand(nextPopulation.length)];
            let x, y, attempts = 0;
            do { x = rand(settings.gridSize); y = rand(settings.gridSize); attempts++; }
            while (occupied[y]?.[x] && attempts < 100);
            if (!occupied[y]?.[x]) {
                occupied[y][x] = true;
                nextPopulation.push({ x, y, color: { ...parent.color }, age: 0 });
            }
        }
        population = nextPopulation;
    }

    function handleInteractions() {
        if (Math.random() > settings.interactionFrequency) return;
        const map = new Map(population.map(p => [`${p.x},${p.y}`, p]));
        for (const p1 of population) {
            if (isBlack(p1.color) && Math.random() < settings.genesisRate) {
                p1.color = { r: 50 + rand(206), g: 50 + rand(206), b: 50 + rand(206) };
                continue;
            }
            const neigh = [];
            for (let dx = -settings.interactionRadius; dx <= settings.interactionRadius; dx++) {
                for (let dy = -settings.interactionRadius; dy <= settings.interactionRadius; dy++) {
                    if (!dx && !dy) continue;
                    const key = `${p1.x + dx},${p1.y + dy}`;
                    if (map.has(key)) neigh.push(map.get(key));
                }
            }
            if (!neigh.length) continue;
            const p2 = neigh[rand(neigh.length)];
            if (isBlack(p2.color) || Math.random() < settings.resistance) continue;

            const coef = interactionCoefficients[settings.coefficientIndex];
            let nr = p1.color.r * coef.c1 + p2.color.r * coef.c2;
            let ng = p1.color.g * coef.c1 + p2.color.g * coef.c2;
            let nb = p1.color.b * coef.c1 + p2.color.b * coef.c2;

            if (Math.random() < settings.mutationProbability) {
                const m = 20;
                nr += rand(m * 2) - m; ng += rand(m * 2) - m; nb += rand(m * 2) - m;
            }
            const newColor = clampColor(nr, ng, nb);
            p1.color = newColor;
            if (Math.random() >= settings.resistance) p2.color = { ...newColor };
        }
    }

    // --- Статистика и анализ ---
    function updateStats() {
        populationCountEl.textContent = population.length;
    }

    function colorDistance(c1, c2) {
        const dr = c1.r - c2.r; const dg = c1.g - c2.g; const db = c1.b - c2.b;
        return Math.sqrt(dr * dr + dg * dg + db * db);
    }

    function analyzeLanguages() {
        const nonBlackPopulation = population.filter(p => !isBlack(p.color));
        if (nonBlackPopulation.length === 0) {
            languageCountEl.textContent = '0';
            languageDistributionEl.innerHTML = '';
            return;
        }
        const distinctLanguages = [];
        for (const individual of nonBlackPopulation) {
            let found = false;
            for (const lang of distinctLanguages) {
                if (colorDistance(individual.color, lang.color) < settings.colorThreshold) {
                    lang.count++;
                    found = true;
                    break;
                }
            }
            if (!found) distinctLanguages.push({ color: { ...individual.color }, count: 1 });
        }
        languageCountEl.textContent = distinctLanguages.length;
        drawDistribution(distinctLanguages);
    }

    function drawDistribution(languages) {
        languageDistributionEl.innerHTML = '';
        const total = languages.reduce((sum, lang) => sum + lang.count, 0);
        if (total === 0) return;
        languages.sort((a, b) => b.count - a.count);
        for (const lang of languages) {
            const bar = document.createElement('div');
            const percentage = (lang.count / total) * 100;
            bar.style.height = `${percentage}%`;
            bar.style.width = '10px';
            bar.style.flexShrink = '0';
            bar.style.backgroundColor = `rgb(${lang.color.r}, ${lang.color.g}, ${lang.color.b})`;
            bar.title = `RGB(${lang.color.r}, ${lang.color.g}, ${lang.color.b})\nКоличество: ${lang.count} (${percentage.toFixed(1)}%)`;
            languageDistributionEl.appendChild(bar);
        }
    }

    // --- Запуск ---
    function init() {
        populateCoefficients();
        addEventListeners();
        readSettings();
        resetSimulation();
    }
    init();
});
</script>
</body>
</html>
