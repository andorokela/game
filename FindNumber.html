<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            color: #2c3e50;
            padding: 10px;
            overflow-x: hidden;
        }

        .canvas-container {
            width: calc(100% - 20px);
            height: 60vh;
            margin: 10px auto;
            padding: 0;
        }

        canvas {
            width: 100%;
            height: 100%;
            background: #fff5e6;
            border: 2px solid #ffcc00;
            border-radius: 10px;
            display: block;
        }

        .controls-container {
            width: calc(100% - 20px);
            margin: 0 auto;
            padding: 0 5px;
        }

        .start-button {
            width: 100%;
            padding: 15px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            cursor: pointer;
            margin: 10px 0;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 0px 0;
        }

        .slider-wrapper {
            position: relative;
            padding: 25px 0 40px; /* Увеличен верхний отступ */
            height: 120px;
        }

        .rs-control {
            margin: 0 auto;
        }

        .rs-range-color {
            background-color: #2196F3;
        }

        .rs-path-color {
            background-color: #dfdfdf;
            border-color: #3f3f3f;
        }

        .rs-handle {
            background-color: #3f3f3f !important;
        }

        .slider-label {
            position: absolute;
            top: 5px; /* Смещение метки выше */
            left: 50%;
            transform: translateX(-50%);
            font-weight: 600;
            font-size: 0.9em;
            color: #2c3e50;
            z-index: 2; /* Метка поверх слайдера */
        }

        .range-labels {
            position: absolute;
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 0.8em;
            color: #7f8c8d;
            pointer-events: none;
            bottom: -20px;
        }

        #time {
            font-size: 1.1em;
            color: #e74c3c;
            text-align: center;
            margin: 10px 0;
        }

        @media (max-width: 480px) {
            .settings-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            
            .slider-wrapper {
                padding: 20px 0 30px;
                height: 100px;
            }
            
            .slider-label {
                top: 3px;
                font-size: 0.8em;
            }
            
            .range-labels {
                font-size: 0.7em;
                bottom: -18px;
            }
        }
    </style>
</head>
<body>
    <div class="canvas-container">
        <canvas id="gameCanvas"></canvas>
    </div>
    
    <div class="controls-container">
            <div class="checkbox-group">
                <label><input type="checkbox" id="angleCheckbox"> Поворот</label>
                <label><input type="checkbox" id="eraseCheckbox"> Стирать</label>
            </div>
        <button id="startButton" class="start-button" onclick="startGame()">Старт</button>
        
        <div class="settings-grid">
            <!-- Максимальное число -->
            <div class="slider-wrapper">
                <div class="slider-label">Макс. число</div>
                <div id="maxNumberSlider" class="rslider"></div>
                <div class="range-labels">
                    <span>1</span>
                    <span>50</span>
                </div>
            </div>

            <!-- Диапазон шрифтов -->
            <div class="slider-wrapper">
                <div class="slider-label">Шрифты</div>
                <div id="fontRangeSlider" class="rslider"></div>
                <div class="range-labels" id="fontRangeLabels">
                    <span id="minFontSizeDisplay">10</span>
                    <span id="maxFontSizeDisplay">80</span>
                </div>
            </div>

            <!-- Флажки -->

        </div>
        
        <div id="time">Время: 0 сек</div>
    </div>

    <script src="https://code.jquery.com/jquery-2.2.4.js"></script>
    <script src="https://cdn.jsdelivr.net/jquery.roundslider/1.0/roundslider.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/jquery.roundslider/1.0/roundslider.min.css">

    <script>
        $(document).ready(function() {
            function initSliders() {
                const sliderRadius = $('.slider-wrapper').width() * 0.45;

                // Слайдер максимального числа
                $("#maxNumberSlider").roundSlider({
                    radius: sliderRadius,
                    width: 8,
                    handleSize: "+12",
                    min: 1,
                    max: 50,
                    value: 30,
                    startAngle: 315,
                    editableTooltip: false,
                    circleShape: "half-top",
                    sliderType: "min-range",
                    change: function(e) {
                        $(this).siblings('.range-labels').find('span:last-child').text(e.value);
                    }
                });

                // Слайдер диапазона шрифтов
                $("#fontRangeSlider").roundSlider({
                    radius: sliderRadius,
                    width: 8,
                    handleSize: "+12",
                    min: 10,
                    max: 80,
                    value: [20, 50],
                    startAngle: 315,
                    editableTooltip: false,
                    circleShape: "half-top",
                    sliderType: "range",
                    change: function(e) {
                        const [min, max] = e.value.split(',');
                        $("#minFontSizeDisplay").text(min);
                        $("#maxFontSizeDisplay").text(max);
                    }
                });
            }

            initSliders();
            $(window).resize(initSliders);
        });

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let numbers = [];
        let currentNumber = 1;
        let startTime;
        let timerInterval;
        let gameOver = false;

        function resizeCanvas() {
            const container = document.querySelector('.canvas-container');
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            if (numbers.length > 0 && !gameOver) {
                generateNumbers();
                drawNumbers();
            }
        });

        resizeCanvas();

        function generateNumbers() {
            const maxNumber = $("#maxNumberSlider").roundSlider("getValue");
            const [minFont, maxFont] = $("#fontRangeSlider").roundSlider("getValue").split(',').map(Number);
            const angleEnabled = document.getElementById('angleCheckbox').checked;

            numbers = [];
            for (let i = 1; i <= maxNumber; i++) {
                let x, y, fontSize, angle = 0;
                let placed = false;
                let attempts = 0;
                
                while (!placed && attempts < 100) {
                    attempts++;
                    fontSize = Math.random() * (maxFont - minFont) + minFont;
                    const minMargin = fontSize * 0.6;
                    
                    x = Math.random() * (canvas.width - minMargin * 2) + minMargin;
                    y = Math.random() * (canvas.height - minMargin * 2) + minMargin;
                    
                    placed = true;
                    for (const num of numbers) {
                        const dx = num.x - x;
                        const dy = num.y - y;
                        const distance = Math.sqrt(dx*dx + dy*dy);
                        const minDistance = (num.fontSize + fontSize) * 0.6;
                        
                        if (distance < minDistance) {
                            placed = false;
                            break;
                        }
                    }
                }
                
                if (angleEnabled) {
                    angle = Math.random() * 60 - 30;
                }
                
                numbers.push({ value: i, x, y, fontSize, angle });
            }
        }

        function drawNumbers() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            numbers.forEach(num => {
                ctx.save();
                ctx.translate(num.x, num.y);
                ctx.rotate(num.angle * Math.PI / 180);
                ctx.font = `${num.fontSize}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#000';
                ctx.fillText(num.value, 0, 0);
                ctx.restore();
            });
        }

        canvas.addEventListener('click', (e) => {
            if (gameOver || !startTime) return;

            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);

            for (let i = 0; i < numbers.length; i++) {
                const num = numbers[i];
                const dx = num.x - x;
                const dy = num.y - y;
                const distance = Math.sqrt(dx*dx + dy*dy);
                const clickRadius = num.fontSize * 0.6;
                
                if (distance < clickRadius && num.value === currentNumber) {
                    if (document.getElementById('eraseCheckbox').checked) {
                        numbers.splice(i, 1);
                        drawNumbers();
                    }
                    
                    currentNumber++;
                    canvas.style.backgroundColor = '#aaffaa';
                    setTimeout(() => canvas.style.backgroundColor = '', 200);
                    
                    if (currentNumber > $("#maxNumberSlider").roundSlider("getValue")) endGame();
                    return;
                }
            }
            
            canvas.style.backgroundColor = '#ffaaaa';
            setTimeout(() => canvas.style.backgroundColor = '', 200);
        });

        function startGame() {
            gameOver = false;
            currentNumber = 1;
            generateNumbers();
            drawNumbers();
            startTime = Date.now();
            document.getElementById('time').textContent = 'Время: 0 сек';
            timerInterval = setInterval(updateTime, 1000);
            document.getElementById('startButton').disabled = false;
        }

        function updateTime() {
            const elapsedTime = Math.floor((Date.now() - startTime) / 1000);
            document.getElementById('time').textContent = `Время: ${elapsedTime} сек`;
        }

        function endGame() {
            clearInterval(timerInterval);
            startTime = null;
            gameOver = true;
            document.getElementById('startButton').disabled = false;
            const time = document.getElementById('time').textContent;
            alert(`Победа! ${time}`);
        }
    </script>
</body>
</html>
