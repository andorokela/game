<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            color: #2c3e50;
            padding: 10px;
            overflow-x: hidden;
        }

        .canvas-container {
            width: calc(100% - 20px);
            height: 60vh;
            margin: 10px auto;
            padding: 0;
        }

        canvas {
            width: 100%;
            height: 100%;
            background: #fff5e6;
            border: 2px solid #ffcc00;
            border-radius: 10px;
            display: block;
        }

        .controls-container {
            width: calc(100% - 20px);
            margin: 0 auto;
        }

        .top-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin: 10px 0;
        }

        .checkbox-group {
            flex: 1;
            display: flex;
            gap: 10px;
            padding: 12px;
            background: white;
            border: 1px solid #eee;
            border-radius: 8px;
        }

        #time {
            flex: 1;
            padding: 12px;
            background: white;
            border: 1px solid #eee;
            border-radius: 8px;
            text-align: center;
            font-size: 1.1em;
            color: #e74c3c;
        }

        .start-button {
            width: 100%;
            padding: 15px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            cursor: pointer;
            margin: 10px 0;
        }

        .slider-container {
            margin: 15px 0;
            position: relative;
        }

        .slider-label {
            text-align: center;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .single-slider {
            width: 100%;
        }

        .range-slider {
            width: 100%;
        }

        .slider-values {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 0.8em;
            color: #7f8c8d;
        }

        @media (max-width: 480px) {
            .top-controls {
                flex-direction: column;
            }
            
            .checkbox-group,
            #time {
                flex: auto;
                margin: 5px 0;
            }
            
            .slider-values {
                font-size: 0.7em;
            }
        }
    </style>
</head>
<body>
    <div class="canvas-container">
        <canvas id="gameCanvas"></canvas>
    </div>
    
    <div class="controls-container">
        <!-- Верхние элементы управления -->
        <div class="top-controls">
            <!-- Флажки -->
            <div class="checkbox-group">
                <label><input type="checkbox" id="angleCheckbox"> Поворот</label>
                <label><input type="checkbox" id="eraseCheckbox"> Стирать</label>
            </div>
            
            <!-- Таймер -->
            <div id="time">Время: 0 сек</div>
        </div>

        <!-- Кнопка Старт -->
        <button id="startButton" class="start-button">Старт</button>

        <!-- Слайдер максимального числа -->
        <div class="slider-container">
            <div class="slider-label">Макс. число</div>
            <input type="range" id="maxNumberSlider" class="single-slider" min="1" max="50" value="10">
            <div class="slider-values">
                <span>1</span>
                <span id="maxNumberDisplay">10</span>
                <span>50</span>
            </div>
        </div>

        <!-- Слайдер диапазона шрифтов -->
        <div class="slider-container">
            <div class="slider-label">Шрифты</div>
            <div id="fontRangeSlider" class="range-slider"></div>
            <div class="slider-values">
                <span id="minFontSizeDisplay">20</span>
                <span id="maxFontSizeDisplay">50</span>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.js"></script>
    <script>
        $(document).ready(function() {
            // Слайдер диапазона шрифтов
            $("#fontRangeSlider").slider({
                range: true,
                min: 10,
                max: 80,
                values: [20, 50],
                slide: function(event, ui) {
                    $("#minFontSizeDisplay").text(ui.values[0]);
                    $("#maxFontSizeDisplay").text(ui.values[1]);
                }
            });

            // Слайдер максимального числа
            $("#maxNumberSlider").on('input', function() {
                $("#maxNumberDisplay").text(this.value);
            });
        });

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let numbers = [];
        let currentNumber = 1;
        let startTime;
        let timerInterval;
        let gameOver = false;

        function resizeCanvas() {
            const container = document.querySelector('.canvas-container');
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            if (numbers.length > 0 && !gameOver) {
                generateNumbers();
                drawNumbers();
            }
        });

        resizeCanvas();

        function generateNumbers() {
            const max = parseInt($("#maxNumberSlider").val());
            const [minFont, maxFont] = $("#fontRangeSlider").slider("values");
            const angleEnabled = $("#angleCheckbox").prop('checked');

            numbers = [];
            for (let i = 1; i <= max; i++) {
                let x, y, fontSize, angle = 0;
                let placed = false;
                let attempts = 0;
                
                while (!placed && attempts < 100) {
                    attempts++;
                    fontSize = Math.random() * (maxFont - minFont) + minFont;
                    const minMargin = fontSize * 0.6;
                    
                    x = Math.random() * (canvas.width - minMargin * 2) + minMargin;
                    y = Math.random() * (canvas.height - minMargin * 2) + minMargin;
                    
                    placed = true;
                    for (const num of numbers) {
                        const dx = num.x - x;
                        const dy = num.y - y;
                        const distance = Math.sqrt(dx*dx + dy*dy);
                        const minDistance = (num.fontSize + fontSize) * 0.6;
                        
                        if (distance < minDistance) {
                            placed = false;
                            break;
                        }
                    }
                }
                
                if (angleEnabled) {
                    angle = Math.random() * 60 - 30;
                }
                
                numbers.push({ value: i, x, y, fontSize, angle });
            }
        }

        function drawNumbers() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            numbers.forEach(num => {
                ctx.save();
                ctx.translate(num.x, num.y);
                ctx.rotate(num.angle * Math.PI / 180);
                ctx.font = `${num.fontSize}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#000';
                ctx.fillText(num.value, 0, 0);
                ctx.restore();
            });
        }

        canvas.addEventListener('click', (e) => {
            if (gameOver || !startTime) return;

            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);

            for (let i = 0; i < numbers.length; i++) {
                const num = numbers[i];
                const dx = num.x - x;
                const dy = num.y - y;
                const distance = Math.sqrt(dx*dx + dy*dy);
                const clickRadius = num.fontSize * 0.6;
                
                if (distance < clickRadius && num.value === currentNumber) {
                    if ($("#eraseCheckbox").prop('checked')) {
                        numbers.splice(i, 1);
                        drawNumbers();
                    }
                    
                    currentNumber++;
                    canvas.style.backgroundColor = '#aaffaa';
                    setTimeout(() => canvas.style.backgroundColor = '', 200);
                    
                    if (currentNumber > parseInt($("#maxNumberSlider").val())) endGame();
                    return;
                }
            }
            
            canvas.style.backgroundColor = '#ffaaaa';
            setTimeout(() => canvas.style.backgroundColor = '', 200);
        });

        function startGame() {
            gameOver = false;
            currentNumber = 1;
            generateNumbers();
            drawNumbers();
            startTime = Date.now();
            $("#time").text('Время: 0 сек');
            timerInterval = setInterval(updateTime, 1000);
            $("#startButton").prop('disabled', true);
        }

        function updateTime() {
            const elapsedTime = Math.floor((Date.now() - startTime) / 1000);
            $("#time").text(`Время: ${elapsedTime} сек`);
        }

        function endGame() {
            clearInterval(timerInterval);
            startTime = null;
            gameOver = true;
            $("#startButton").prop('disabled', false);
            alert(`Победа! ${$("#time").text()}`);
        }

        // Привязка события кнопки Старт
        $("#startButton").on('click', startGame);
    </script>
</body>
</html>
